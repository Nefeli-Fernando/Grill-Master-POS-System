<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grill Master</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="Assets\Logos\Fiery Grill Master Food Truck Logo.png">
</head>
<body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <symbol id="menu" viewBox="0 0 24 24">
            <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </symbol>
        <symbol id="close" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </symbol>
        <symbol id="grid" viewBox="0 0 24 24">
            <path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z" fill="currentColor"></path>
        </symbol>
        <symbol id="chart" viewBox="0 0 24 24">
            <path d="M4 19V5h2v12h14v2H4zm4-4V9h3v6H8zm5 0V5h3v10h-3zm5 0v-4h3v4h-3z" fill="currentColor"></path>
        </symbol>
        <symbol id="mail" viewBox="0 0 24 24">
            <path d="M3 5h18v14H3V5zm2 2v.5l7 5 7-5V7H5zm14 10V9.9l-7 5-7-5V17h14z" fill="currentColor"></path>
        </symbol>
        <symbol id="gear" viewBox="0 0 24 24">
            <path d="m19.4 13 .1-1-.1-1 2-1.6-2-3.4-2.4 1a7.8 7.8 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.8 7.8 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6-.1 1 .1 1-2 1.6 2 3.4 2.4-1a7.8 7.8 0 0 0 1.7 1L11 21h4l.4-2.9a7.8 7.8 0 0 0 1.7-1l2.4 1 2-3.4-2.1-1.7zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" fill="currentColor" transform="translate(-1)"></path>
        </symbol>
    </svg>

    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <button id="toggle" type="button" aria-label="Toggle sidebar" aria-expanded="false">
                <svg aria-hidden="true"><use href="#menu"></use></svg>
            </button>
            <!--<a href="#" class="logo">
                <img src="Assets\Logos\Fiery Grill Master Food Truck Logo.png" alt="Grill Master Logo" width="90" height="50">
                <span>Grill Master</span>
            </a>-->
            <nav aria-label="Main menu">
                <a href="pos.html">
                    <img src="Assets\Logos\6408090.png" alt="POS icon" width="26" height="26"><span><b>POS</b></span>
                </a>
                <a href="customers.html">
                    <img src="Assets\Logos\Customers.png" alt="POS icon" width="26" height="26"><span><b>Customers</b></span>
                </a>
                <a href="index.html" class="on" aria-current="page">
                    <img src="Assets\Logos\Orders.png" alt="POS icon" width="26" height="26"><span><b>Orders</b></span>
                </a>
            </nav>
        </aside>

        <div class="app-content">
                <header class="page-header">
                <center>
                    <div class="titlee">
                    <h2>Grill Master</h2>
                </div>
                </center>
                <div class="cart-widget">
                    <button class="cart-toggle" id="cart-toggle" type="button" aria-label="Open cart" aria-expanded="false" aria-controls="cart-panel">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"></path>
                        <circle cx="10" cy="21" r="1"></circle>
                        <circle cx="18" cy="21" r="1"></circle>
                </svg>
                <span class="cart-badge" id="cart-badge" aria-live="polite">0</span>
                    </button>
                    <section class="cart-panel" id="cart-panel" aria-label="Your cart" hidden>
                    <h2>Your order</h2>
                    <ul class="cart-items" id="cart-items"></ul>
                    <p class="cart-empty" id="cart-empty">Your cart is empty.</p>
                    <div class="cart-summary-row">
                        <span>Subtotal</span>
                        <strong id="cart-subtotal">Rs. 0</strong>
                    </div>
                    <div class="cart-summary-row cart-discount-total">
                        <span>Discount</span>
                        <strong id="cart-discount">- Rs. 0</strong>
                    </div>
                    <div class="cart-total">
                        <span>Total</span>
                        <strong id="cart-total">Rs. 0</strong>
                    </div>
                    </section>
                </div>
                </header>
                <div class="menu-layout">
                    <section class="product-menu" id="orders-page" aria-label="Orders">
                        <div class="category-buttons">
                            <button class="btnn" type="button" data-target="Burger" aria-pressed="true">Burger</button>
                            <button class="btnn" type="button" data-target="Fries" aria-pressed="false">Fries</button>
                            <button class="btnn" type="button" data-target="Drinks" aria-pressed="false">Drinks</button>
                            <button class="btnn" type="button" data-target="Desserts" aria-pressed="false">Desserts</button>
                        </div>
                    <div class="yuri">
                        <h1 id="category-heading">Burgers</h1><br>
                        </div>
                        <div id="product-grid" class="grid"></div>
                        <p id="cart-count">Items in order: 0</p>
                    </section>
                    <br><br>
                </div>
            <template id="product-add-template">
                <div class="add-control">
                    <button class="add-btn" type="button" aria-label="Add item to cart">
                    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M12 5v14M5 12h14"></path>
                    </svg>
                    </button>
                </div>
            </template>
        </div>
    </div>

    <script src="js/sidebar.js"></script>
    <script src="js/main.js"></script>
    <footer class="copyright">
        © Grill Master 2026 | Made by Nefeli Fernando | All Rights Reserved
    </footer>
</body>
</html>
